<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#0b3b4a"/>
      <stop offset="1" stop-color="#061626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- lens -->
  <circle cx="238" cy="238" r="126" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="238" cy="238" r="126" fill="none" stroke="#ffffff" stroke-width="34"/>

  <!-- keyhole inside the lens -->
  <circle cx="238" cy="212" r="34" fill="#ffffff"/>
  <rect x="223" y="232" width="30" height="62" rx="15" fill="#ffffff"/>

  <!-- handle -->
  <line x1="328" y1="328" x2="418" y2="418" stroke="#ffffff" stroke-width="42" stroke-linecap="round"/>
  <line x1="392" y1="392" x2="418" y2="418" stroke="#34d399" stroke-width="42" stroke-linecap="round"/>
</svg>
